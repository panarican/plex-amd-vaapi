name: build-and-push

# Rebuilds the image on top of the LATEST linuxserver/plex daily, so the published
# image tracks new Plex releases automatically (the AMD driver layers are re-applied
# on each build). Also builds on push to master and on manual dispatch.
on:
  schedule:
    - cron: '17 6 * * *'        # daily ~06:17 UTC
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # a missing/expired PLEX_TOKEN shouldn't sink the public build
      matrix:
        include:
          - channel: public
            tag: latest
          - channel: plexpass
            tag: plexpass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Attempt 1 is allowed to fail: this step pulls the BuildKit image from Docker Hub,
      # and a transient registry timeout here killed the 2026-08-07 build outright
      # (ERROR: Get "https://registry-1.docker.io/v2/": context deadline exceeded).
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Back off before Buildx retry
        if: steps.buildx.outcome == 'failure'
        run: sleep 30

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.channel }} channel, latest Plex + AMD VAAPI driver)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          pull: true               # always pull the freshest linuxserver/plex base
          provenance: false
          build-args: |
            PLEX_CHANNEL=${{ matrix.channel }}
          secrets: |
            plex_token=${{ secrets.PLEX_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/plex-amd-vaapi:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Plex + AMD VAAPI driver for gfx1150/gfx1151 (H.264 HW transcode) [${{ matrix.channel }} channel]

  # A scheduled build that fails is otherwise silent - it just doesn't publish, and the
  # server keeps running the previous image. Open (or comment on) an issue so it surfaces.
  notify-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the build-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Automated build failed"
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
                  --json number,title --jq "[.[] | select(.title==\"$TITLE\")][0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again on \`${{ github.event_name }}\`: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The \`build-and-push\` workflow failed: $RUN_URL

          The published image is now stale - the server keeps running whatever it last pulled.
          Transient \`registry-1.docker.io\` timeouts are the known flake; re-running the job usually clears it."
          fi
