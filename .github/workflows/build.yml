name: build-and-push

# Rebuilds the image on top of the LATEST linuxserver/plex daily, so the published
# image tracks new Plex releases automatically (the AMD driver layers are re-applied
# on each build). Also builds on push to master and on manual dispatch.
on:
  schedule:
    - cron: '17 6 * * *'        # daily ~06:17 UTC
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # a missing/expired PLEX_TOKEN shouldn't sink the public build
      matrix:
        include:
          - channel: public
            tag: latest
          - channel: plexpass
            tag: plexpass
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.channel }} channel, latest Plex + AMD VAAPI driver)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          pull: true               # always pull the freshest linuxserver/plex base
          provenance: false
          build-args: |
            PLEX_CHANNEL=${{ matrix.channel }}
          secrets: |
            plex_token=${{ secrets.PLEX_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/plex-amd-vaapi:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Plex + AMD VAAPI driver for gfx1150/gfx1151 (H.264 HW transcode) [${{ matrix.channel }} channel]
